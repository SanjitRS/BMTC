# Netlify Configuration for Gurugale Dementia Care Platform

[build]
  base = "client"
  publish = "dist"
  command = "npm install && npm run build"

# SPA routing redirect (prevents 404 on page refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
